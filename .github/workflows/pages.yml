name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the app and service worker versions match
        run: |
          A=$(grep -oP "APP_VERSION = '\K[^']+" app/index.html)
          S=$(grep -oP "VERSION = '\K[^']+" app/sw.js)
          echo "app=$A sw=$S"
          [ "$A" = "$S" ] || { echo "Version mismatch: bump both APP_VERSION and VERSION"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
